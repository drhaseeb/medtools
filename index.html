<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6E63" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Doctors' Medical ORG" />
    <!-- This is a client-rendered SPA — PageMeta.tsx overwrites title/description/
         canonical per-route once React mounts, but a crawler or scanner that
         doesn't execute JavaScript only ever sees these static tags, for every
         route, since <div id="root"> is empty until then. This app now serves
         the root domain natively (Doctors' Medical ORG's homepage at "/", the
         tools directory at "/tools") — these fallback values describe the
         root route specifically, matching whatever DMOHome's own PageMeta
         call says. -->
    <title>Doctors' Medical ORG - A Non-Profit</title>
    <meta
      name="description"
      content="A non-profit building free clinical guidelines, decision-support tools, and a hospital information system for doctors across Pakistan."
    />
    <link rel="canonical" href="https://www.doctorsmedical.org.pk/" />
    <meta property="og:title" content="Doctors' Medical ORG - A Non-Profit" />
    <meta
      property="og:description"
      content="A non-profit building free clinical guidelines, decision-support tools, and a hospital information system for doctors across Pakistan."
    />
    <meta property="og:url" content="https://www.doctorsmedical.org.pk/" />
    <meta property="og:type" content="website" />

    <!-- Google Analytics is now injected by Cloudflare Zaraz (Workers &
         Pages > Zaraz), not loaded here directly — Zaraz reads/queues
         through this same dataLayer, so consent defaults set before it
         loads are still respected regardless of which script actually
         drains the queue.

         Consent Mode v2 defaults — denied-by-default is only a legal
         requirement for EEA/UK/Switzerland visitors (GDPR/ePrivacy) — a
         call with no region scopes to everyone NOT covered by a more
         specific region-scoped call, and the more specific one wins for
         those it lists. So: grant by default globally, then override back
         to denied for exactly the regulated region list. This still gates
         AdSense (adsBootstrap.ts, loaded directly, unchanged) and whatever
         Zaraz injects for Analytics. Zaraz's CMP (or Funding Choices) calls
         gtag('consent', 'update', ...) once an EEA/UK/CH visitor responds.

         US state privacy laws (CA/CO/CT/etc. — the ~19 states Funding
         Choices shows its "US state regulations" message to) are opt-OUT
         regimes, not opt-in like GDPR: granted-by-default is the correct
         starting state there too. The message just adds a "Do Not
         Sell/Share My Info" link; only a visitor who actively uses it gets
         moved to denied via gtag('consent','update',...). So no separate
         US region block is needed here — the global default already
         covers every US state (and everywhere else outside EEA/UK/CH)
         correctly with zero extra code. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted',
        analytics_storage: 'granted',
      });
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        region: ['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','CH','GB'],
      });
    </script>

    <!-- Google AdSense and the Funding Choices consent tag are intentionally NOT
         static tags here — they're injected from src/lib/adsBootstrap.ts instead,
         which skips the /privacy route (this app hosts its own /privacy again,
         now that it serves the root domain — see adsBootstrap.ts's
         EXCLUDED_PATHS). Google's requirement that the registered privacy-policy
         page not host consent-requiring scripts is enforced there. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "NGO",
            "@id": "https://www.doctorsmedical.org.pk/#organization",
            "name": "Doctors' Medical ORG",
            "url": "https://www.doctorsmedical.org.pk",
            "logo": "https://www.doctorsmedical.org.pk/icons/icon-512.png",
            "email": "contact@doctorsmedical.org.pk",
            "foundingDate": "2022",
            "sameAs": [
              "https://clinic.doctorsmedical.org.pk",
              "https://resus.doctorsmedical.org.pk",
              "https://www.facebook.com/doctorsmedicalorg/",
              "https://www.instagram.com/doctorsmedicalorg/",
              "https://www.linkedin.com/company/doctorsmedical/"
            ],
            "subOrganization": [{ "@id": "https://clinic.doctorsmedical.org.pk/#organization" }]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
