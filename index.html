<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6E63" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Doctors' Medical Center" />
    <title>Doctors' Medical Center</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3Z1G5GX244"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Consent Mode v2 defaults — must be set before gtag('config', ...) and
      // before the Funding Choices CMP script loads, or Google may not
      // correctly gate data collection/ad requests on the visitor's actual
      // consent choice. Funding Choices calls gtag('consent', 'update', ...)
      // automatically once the visitor responds — no extra code needed there.
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
      });
      gtag('config', 'G-3Z1G5GX244');
    </script>

    <!-- Google AdSense and the Funding Choices consent tag are intentionally NOT
         static tags here — they're injected conditionally by src/lib/adsBootstrap.ts,
         which skips the /privacy route entirely. Google's own requirement for the
         registered privacy-policy page is explicit: "The pages don't host scripts
         that require user consent, including ad tags. The pages don't contain the
         Funding Choices consent message tag." Since this is a single-page app, one
         static index.html can't satisfy that per-route — so the scripts are loaded
         from JS after checking the current path instead. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalOrganization",
        "name": "Doctors' Medical Center",
        "url": "https://www.doctorsmedical.org.pk/tools",
        "logo": "https://www.doctorsmedical.org.pk/tools/icons/icon-512.png",
        "email": "contact@doctorsmedical.org.pk",

          "https://www.facebook.com/doctorsmedicalorg/",
          "https://www.instagram.com/doctorsmedicalorg/",
          "https://www.linkedin.com/company/doctorsmedical/"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Dr Haseeb Ahsin",
        "url": "https://drhaseeb.me",
        "worksFor": {
          "@type": "Organization",
          "name": "Doctors' Medical Center"
        }
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
